
{% extends "base.html" %}

{% block title %}Login - FindIt Campus Lost & Found{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="auth-wrapper">
        <div class="auth-card">

            <!-- Header -->
            <div class="text-center mb-4">
                <span class="badge bg-primary-subtle text-primary px-3 py-1 rounded-pill fw-semibold mb-2">
                    <i class="bi bi-shield-check me-1"></i> FindIt Portal
                </span>

                <h3 class="fw-bold text-dark mb-1">Welcome Back!</h3>

                <p class="text-muted small">
                    Login to access your FindIt account.
                </p>
            </div>

            <!-- Account Type Selection -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Login as</label>

                <div class="d-flex gap-3">

                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="radio"
                            name="login_role"
                            id="studentLogin"
                            value="student"
                            checked>

                        <label class="form-check-label" for="studentLogin">
                            <i class="bi bi-mortarboard me-1"></i> Student
                        </label>
                    </div>

                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="radio"
                            name="login_role"
                            id="adminLogin"
                            value="admin">

                        <label class="form-check-label" for="adminLogin">
                            <i class="bi bi-shield-lock me-1"></i> Admin
                        </label>
                    </div>

                </div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">
                        College Email ID
                    </label>

                    <div class="input-group">
                        <span class="input-group-text input-icon border-end-0">
                            <i class="bi bi-envelope-fill"></i>
                        </span>

                        <input
                            type="email"
                            class="form-control border-start-0"
                            id="email"
                            name="email"
                            placeholder="Enter your college email"
                            autocomplete="username"
                            required>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <div class="input-group">
                        <span class="input-group-text input-icon border-end-0">
                            <i class="bi bi-lock-fill"></i>
                        </span>

                        <input
                            type="password"
                            class="form-control border-start-0 border-end-0"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="password-toggle-btn rounded-end"
                            id="togglePassword"
                            aria-label="Toggle password visibility">

                            <i class="bi bi-eye" id="togglePasswordIcon"></i>

                        </button>
                    </div>
                </div>

                <!-- Error Message -->
                <div id="loginError"
                     class="alert alert-danger d-none"
                     role="alert">
                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    id="loginSubmitBtn"
                    class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">

                    <i class="bi bi-box-arrow-in-right me-1"></i>
                    <span id="loginButtonText">Login as Student</span>

                </button>

            </form>

            <!-- Register Link: Student only -->
            <div class="text-center pt-3 border-top" id="registerLink">
                <p class="small text-muted mb-0">
                    Don't have an account?

                    <a href="{{ url_for('register_page') }}"
                       class="text-primary fw-semibold text-decoration-none">

                        Register here
                        <i class="bi bi-arrow-right-short"></i>

                    </a>
                </p>
            </div>

        </div>
    </div>
</div>

{% endblock %}


{% block extra_js %}

<script>
document.addEventListener("DOMContentLoaded", function () {

    const studentLogin = document.getElementById("studentLogin");
    const adminLogin = document.getElementById("adminLogin");

    const loginForm = document.getElementById("loginForm");
    const loginButtonText = document.getElementById("loginButtonText");
    const registerLink = document.getElementById("registerLink");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const loginError = document.getElementById("loginError");
    const loginButton = document.getElementById("loginSubmitBtn");

    const togglePassword = document.getElementById("togglePassword");
    const togglePasswordIcon = document.getElementById("togglePasswordIcon");

    // Change login interface according to selected role
    function updateLoginRole() {

        if (adminLogin.checked) {

            loginButtonText.textContent = "Login as Admin";
            registerLink.classList.add("d-none");

            emailInput.placeholder = "Enter admin college email";

        } else {

            loginButtonText.textContent = "Login as Student";
            registerLink.classList.remove("d-none");

            emailInput.placeholder = "Enter your college email";

        }

        loginError.classList.add("d-none");
        loginError.textContent = "";
    }

    studentLogin.addEventListener("change", updateLoginRole);
    adminLogin.addEventListener("change", updateLoginRole);

    // Show / Hide Password
    togglePassword.addEventListener("click", function () {

        if (passwordInput.type === "password") {

            passwordInput.type = "text";
            togglePasswordIcon.classList.replace("bi-eye", "bi-eye-slash");

        } else {

            passwordInput.type = "password";
            togglePasswordIcon.classList.replace("bi-eye-slash", "bi-eye");

        }

    });

    // Login Form Submission
    loginForm.addEventListener("submit", async function (event) {

        event.preventDefault();

        loginError.classList.add("d-none");

        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const role = adminLogin.checked ? "admin" : "student";

        if (!email || !password) {

            loginError.textContent = "Please enter your email and password.";
            loginError.classList.remove("d-none");
            return;

        }

        loginButton.disabled = true;
        loginButtonText.textContent = "Logging in...";

        try {

            const response = await fetch("/api/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "same-origin",

                body: JSON.stringify({
                    email: email,
                    password: password,
                    role: role
                })

            });

            const result = await response.json();

            if (!response.ok || !result.success) {

                throw new Error(result.message || "Invalid login credentials.");

            }

            // Redirect according to account type
            if (role === "admin") {

                window.location.href = "/admin";

            } else {

                window.location.href = "/";

            }

        } catch (error) {

            loginError.textContent = error.message || "Something went wrong. Please try again.";
            loginError.classList.remove("d-none");

            loginButton.disabled = false;
            updateLoginRole();

        }

    });

});
</script>

{% endblock %}
